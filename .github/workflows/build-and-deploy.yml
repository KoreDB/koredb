name: Build and Deploy

# By default a plain manual dispatch builds and publishes ONLY the Node.js
# and Python packages, for Windows / macOS / Linux on both arm64 and amd64.
#
# The remaining deployment targets (WebAssembly, the Rust crate, precompiled
# shell binaries and extensions) are kept but opted out of by default; tick the
# matching includeXxx box on a manual dispatch to build them.

on:
  # Manual only, on purpose: this pipeline publishes to npm and PyPI, and that
  # is not something to run unattended. Dispatch it by hand and tick isDeploy
  # for the release you want.
  workflow_dispatch:
    inputs:
      isDeploy:
        description: "Whether the build should be deployed?"
        type: boolean
        required: true
        default: false
      skipNodejs:
        description: "Skip building Node.js?"
        type: boolean
        required: true
        default: false
      skipPython:
        description: "Skip building Python?"
        type: boolean
        required: true
        default: false
      includeWasm:
        description: "Also build WebAssembly? (off by default)"
        type: boolean
        required: true
        default: false
      includeRust:
        description: "Also build the Rust crate? (off by default)"
        type: boolean
        required: true
        default: false
      includeBinaries:
        description: "Also build precompiled binaries? (off by default)"
        type: boolean
        required: true
        default: false
      includeExtensions:
        description: "Also build extensions? (off by default)"
        type: boolean
        required: true
        default: false

env:
  PIP_BREAK_SYSTEM_PACKAGES: 1

jobs:
  # ---------------------------------------------------------------- Node.js --

  build-nodejs-mac:
    if: ${{ github.event.inputs.skipNodejs != 'true' }}
    uses: ./.github/workflows/mac-nodejs-workflow.yml
    secrets: inherit

  build-nodejs-linux:
    if: ${{ github.event.inputs.skipNodejs != 'true' }}
    uses: ./.github/workflows/linux-nodejs-workflow.yml
    secrets: inherit

  build-nodejs-windows:
    if: ${{ github.event.inputs.skipNodejs != 'true' }}
    uses: ./.github/workflows/windows-nodejs-workflow.yml
    secrets: inherit

  package-nodejs:
    if: ${{ github.event.inputs.skipNodejs != 'true' }}
    needs: [build-nodejs-mac, build-nodejs-linux, build-nodejs-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect prebuilt binaries
        uses: actions/download-artifact@v4
        with:
          pattern: "*-nodejs-module-*"
          path: tools/nodejs_api/prebuilt
          merge-multiple: true

      - name: List prebuilt binaries
        run: ls -l tools/nodejs_api/prebuilt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the main package and the per-platform addon packages
        run: node package
        working-directory: tools/nodejs_api

      - name: Show packaged tarballs
        working-directory: tools/nodejs_api
        run: |
          ls -l dist
          cat dist/packages.json

      - name: Upload tarballs
        uses: actions/upload-artifact@v4
        with:
          name: koredb-deploy-nodejs
          path: tools/nodejs_api/dist
          if-no-files-found: error
          retention-days: 1

  test-nodejs-electron:
    if: ${{ github.event.inputs.skipNodejs != 'true' }}
    needs: [package-nodejs]
    uses: ./.github/workflows/nodejs-electron-test.yml
    with:
      artifactName: koredb-deploy-nodejs
    secrets: inherit

  deploy-nodejs:
    if: ${{ github.event.inputs.skipNodejs != 'true' }}
    needs: [package-nodejs, test-nodejs-electron]
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_JS_TOKEN }}
    steps:
      # publish.js lives in the repository, not in the built artifact.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: koredb-deploy-nodejs
          path: tools/nodejs_api/dist

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # publish.js pushes the per-platform addon packages first and the main
      # package last, so `koredb` is never resolvable before the binary it
      # pins as an optional dependency is.
      - name: Deploy to npm.js dry run
        if: ${{ github.event.inputs.isDeploy != 'true' }}
        run: node publish.js --tag latest --dry-run
        working-directory: tools/nodejs_api

      - name: Deploy to npm.js
        if: ${{ github.event.inputs.isDeploy == 'true' }}
        run: node publish.js --tag latest
        working-directory: tools/nodejs_api

  # ----------------------------------------------------------------- Python --

  build-wheel-mac:
    if: ${{ github.event.inputs.skipPython != 'true' }}
    uses: ./.github/workflows/mac-wheel-workflow.yml
    secrets: inherit

  build-wheel-linux:
    if: ${{ github.event.inputs.skipPython != 'true' }}
    uses: ./.github/workflows/linux-wheel-workflow.yml
    secrets: inherit

  build-wheel-windows:
    if: ${{ github.event.inputs.skipPython != 'true' }}
    uses: ./.github/workflows/windows-wheel-workflow.yml
    secrets: inherit

  package-python-sdist:
    if: ${{ github.event.inputs.skipPython != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package Python sdist
        run: python package_tar.py
        working-directory: scripts/pip-package

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: scripts/pip-package/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  deploy-python:
    permissions:
      id-token: write
    if: ${{ github.event.inputs.skipPython != 'true' }}
    needs:
      [
        build-wheel-mac,
        build-wheel-linux,
        build-wheel-windows,
        package-python-sdist,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Collect wheels
        uses: actions/download-artifact@v4
        with:
          pattern: "*-wheels-*"
          path: dist
          merge-multiple: true

      - name: Collect sdist
        uses: actions/download-artifact@v4
        with:
          name: python-sdist
          path: dist

      - name: List wheels
        run: ls -l
        working-directory: dist

      - name: Deploy to PyPI test
        if: ${{ github.event.inputs.isDeploy != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Deploy to PyPI
        if: ${{ github.event.inputs.isDeploy == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1

  # ----------------------------------------------- Opt-in deployment targets --

  build-extension:
    if: ${{ github.event.inputs.includeExtensions == 'true' }}
    uses: ./.github/workflows/build-and-deploy-extension.yml
    secrets: inherit

  build-wasm:
    if: ${{ github.event.inputs.includeWasm == 'true' }}
    uses: ./.github/workflows/wasm-workflow.yml
    secrets: inherit

  deploy-wasm:
    if: ${{ github.event.inputs.includeWasm == 'true' }}
    needs: [build-wasm]
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_JS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: koredb-deploy-wasm
          path: tools/wasm

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Show tarball contents
        run: tar -tvf koredb-wasm.tar.gz
        working-directory: tools/wasm

      - name: Deploy to npm.js dry run
        if: ${{ github.event.inputs.isDeploy != 'true' }}
        run: npm publish koredb-wasm.tar.gz --access public --dry-run
        working-directory: tools/wasm

      - name: Deploy to npm.js
        if: ${{ github.event.inputs.isDeploy == 'true' }}
        run: npm publish koredb-wasm.tar.gz --access public --tag latest
        working-directory: tools/wasm

  deploy-rust:
    if: ${{ github.event.inputs.includeRust == 'true' }}
    runs-on: ubuntu-24.04
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Update Cargo.toml version
        run: python3 update_version.py
        working-directory: tools/rust_api

      - name: Deploy crate to Crates.io
        run: cargo publish --allow-dirty
        if: ${{ github.event.inputs.isDeploy == 'true' }}
        working-directory: tools/rust_api

      - name: Test publishing crate
        run: cargo publish --dry-run --allow-dirty
        if: ${{ github.event.inputs.isDeploy != 'true' }}
        working-directory: tools/rust_api

  build-precompiled-bin-mac:
    if: ${{ github.event.inputs.includeBinaries == 'true' }}
    uses: ./.github/workflows/mac-precompiled-bin-workflow.yml
    permissions:
      contents: write
    secrets: inherit

  build-precompiled-bin-linux:
    if: ${{ github.event.inputs.includeBinaries == 'true' }}
    uses: ./.github/workflows/linux-precompiled-bin-workflow.yml
    permissions:
      contents: write
    secrets: inherit

  build-precompiled-bin-windows:
    if: ${{ github.event.inputs.includeBinaries == 'true' }}
    uses: ./.github/workflows/windows-precompiled-bin-workflow.yml
    permissions:
      contents: write
    secrets: inherit
