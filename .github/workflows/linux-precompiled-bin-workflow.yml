name: Build Linux Precompiled Binaries

on:
  workflow_dispatch:
    inputs:
      isNightly:
        description: "Publish to the rolling `nightly` release instead of the version tag"
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      isNightly:
        type: boolean
        required: true
        default: false
      x86_64Only:
        type: boolean
        required: false
        default: false

env:
  PIP_BREAK_SYSTEM_PACKAGES: 1

jobs:
  build-precompiled-bin-x86_64:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update nightly version
        if: ${{ inputs.isNightly == true }}
        run: |
          /opt/python/cp310-cp310/bin/python -m pip install packaging
          /opt/python/cp310-cp310/bin/python update-nightly-build-version.py
        working-directory: scripts

      - name: Build precompiled binaries
        run: |
          make NUM_THREADS=$(nproc)
          make install

      - name: Collect artifacts
        run: |
          mv install/include/koredb.h .
          mv install/include/koredb.hpp .
          mv install/lib64/libkoredb.so .
          mv install/bin/koredb .

      - name: Create tarball
        run: |
          tar -czvf libkoredb-linux-x86_64.tar.gz koredb.h koredb.hpp libkoredb.so
          tar -czvf koredb_cli-linux-x86_64.tar.gz koredb

      - uses: actions/upload-artifact@v4
        with:
          name: libkoredb-linux-x86_64
          path: libkoredb-linux-x86_64.tar.gz
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: koredb_cli-linux-x86_64
          path: koredb_cli-linux-x86_64.tar.gz
          retention-days: 1

      - name: Publish the binaries to a GitHub Release
        uses: ./.github/actions/upload-release-asset
        with:
          nightly: ${{ inputs.isNightly }}
          files: libkoredb-linux-x86_64.tar.gz koredb_cli-linux-x86_64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}

  build-precompiled-bin-aarch64:
    if: ${{ inputs.x86_64Only != true }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update nightly version
        if: ${{ inputs.isNightly == true }}
        run: |
          /opt/python/cp310-cp310/bin/python -m pip install packaging
          /opt/python/cp310-cp310/bin/python update-nightly-build-version.py
        working-directory: scripts

      - name: Build precompiled binaries
        run: |
          make NUM_THREADS=$(nproc)
          make install

      - name: Collect artifacts
        run: |
          mv install/include/koredb.h .
          mv install/include/koredb.hpp .
          mv install/lib64/libkoredb.so .
          mv install/bin/koredb .

      - name: Create tarball
        run: |
          tar -czvf libkoredb-linux-aarch64.tar.gz koredb.h koredb.hpp libkoredb.so
          tar -czvf koredb_cli-linux-aarch64.tar.gz koredb

      - uses: actions/upload-artifact@v4
        with:
          name: libkoredb-linux-aarch64
          path: libkoredb-linux-aarch64.tar.gz
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: koredb_cli-linux-aarch64
          path: koredb_cli-linux-aarch64.tar.gz
          retention-days: 1

      - name: Publish the binaries to a GitHub Release
        uses: ./.github/actions/upload-release-asset
        with:
          nightly: ${{ inputs.isNightly }}
          files: libkoredb-linux-aarch64.tar.gz koredb_cli-linux-aarch64.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}

  build-precompiled-bin-android-armv8a:
    if: ${{ inputs.x86_64Only != true }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update nightly version
        if: ${{ inputs.isNightly == true }}
        run: |
          python3 -m pip install packaging
          python3 update-nightly-build-version.py
        working-directory: scripts

      - name: Build precompiled binaries
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a  ..
          make -j$(nproc)
          cd ..
          cmake --install build --prefix install
    
      - name: Collect artifacts
        run: |
          mv install/include/koredb.h .
          mv install/include/koredb.hpp .
          mv install/lib/libkoredb.so .
          mv install/bin/koredb .
        
      - name: Create tarball
        run: |
          tar -czvf libkoredb-android-armv8a.tar.gz koredb.h koredb.hpp libkoredb.so
          tar -czvf koredb_cli-android-armv8a.tar.gz koredb
        
      - uses: actions/upload-artifact@v4
        with:
          name: libkoredb-android-armv8a
          path: libkoredb-android-armv8a.tar.gz
          retention-days: 1
        
      - uses: actions/upload-artifact@v4
        with:
          name: koredb_cli-android-armv8a
          path: koredb_cli-android-armv8a.tar.gz
          retention-days: 1

      - name: Publish the binaries to a GitHub Release
        uses: ./.github/actions/upload-release-asset
        with:
          nightly: ${{ inputs.isNightly }}
          files: libkoredb-android-armv8a.tar.gz koredb_cli-android-armv8a.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
