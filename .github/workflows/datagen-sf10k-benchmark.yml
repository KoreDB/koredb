name: DataGen-SF10K
on:
  # Manual only. This job is expensive and is not part of the day-to-day
  # loop; the nightly schedule was removed deliberately. Start it from the
  # Actions tab when you actually want the numbers.
  workflow_dispatch:
  workflow_call:

jobs:
  benchmark:
    name: datagen-sf10k benchmark
    env:
      NUM_THREADS: 4
      GEN: Ninja
      EXTENSION_LIST: "algo"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make benchmark

      - name: Benchmark
        continue-on-error: true
        run: |
          set +e
          python3 benchmark/benchmark_runner.py --dataset datagen-sf10k --thread 100
          echo $? > benchmark/exit_code

      - name: Upload benchmark logs
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-logs
          path: /tmp/benchmark_logs

      - name: Upload comparison results
        uses: actions/upload-artifact@v4
        with:
          name: comparison-results
          path: benchmark/compare_result.md

      - name: Fail if benchmark failed
        run: |
          if [ $(cat benchmark/exit_code) -ne 0 ]; then
            echo "Benchmark failed"
            exit 1
          fi
