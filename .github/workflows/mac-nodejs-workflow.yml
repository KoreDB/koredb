name: Build macOS Node.js Module

on:
  workflow_dispatch:
    inputs:
      uploadToRelease:
        description: "Also upload the built addons to a GitHub Release"
        type: boolean
        required: false
        default: false
      releaseTag:
        description: "Release tag to upload to. Empty derives v<project version> from CMakeLists.txt."
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      uploadToRelease:
        type: boolean
        required: false
        default: false
      releaseTag:
        type: string
        required: false
        default: ""
env:
  PIP_BREAK_SYSTEM_PACKAGES: 1

jobs:
  build-mac-nodejs:
    name: macos-nodejs-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            cmakeArch: arm64
          # macos-26-intel is GitHub's replacement for the retired macos-13
          # image and is the last x86_64 macOS runner (available until Aug 2027).
          - runner: macos-26-intel
            arch: x64
            cmakeArch: x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      # cmake-js is needed at configure time to locate the Node-API headers.
      - name: Install Node.js build dependencies
        working-directory: tools/nodejs_api
        run: npm install

      - name: Build Node.js native module
        run: make nodejs
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          # Electron requires macOS 11, so the addon must not need anything newer.
          EXTRA_CMAKE_FLAGS: >-
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmakeArch }}
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      # Electron loadability and the glibc/libstdc++ floor are properties of
      # the produced binary that no passing Node.js test suite can detect -
      # every way of losing them still works under plain `node`. They are
      # asserted here, on the artifact that ships.
      - name: Verify the addon
        working-directory: tools/nodejs_api
        run: |
          lipo -archs build/koredbjs.node
          npm run verify:addon -- build/koredbjs.node

      - name: Move Node.js native module
        working-directory: tools/nodejs_api/build
        run: mv koredbjs.node koredbjs-darwin-${{ matrix.arch }}.node

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: mac-nodejs-module-${{ matrix.arch }}
          path: tools/nodejs_api/build/koredbjs-darwin-${{ matrix.arch }}.node
          if-no-files-found: error
          retention-days: 1

  # Publishing runs on its own hosted runner rather than inside the build
  # job: the composite action drives `gh`, which the build environment does
  # not necessarily have (the Linux addon is built inside a manylinux
  # container). Downloading the artifact back is cheap by comparison.
  publish-release:
    name: publish the macOS addons to a GitHub Release
    needs: [build-mac-nodejs]
    if: ${{ inputs.uploadToRelease }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: mac-nodejs-module-*
          path: prebuilt
          merge-multiple: true

      - name: List the addons to publish
        run: ls -l prebuilt

      - name: Publish the addons to a GitHub Release
        uses: ./.github/actions/upload-release-asset
        with:
          files: prebuilt/*.node
          tag: ${{ inputs.releaseTag }}
          token: ${{ secrets.GITHUB_TOKEN }}
