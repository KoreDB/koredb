name: Build macOS Node.js Module

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      isNightly:
        type: boolean
        required: true
        default: false

env:
  PIP_BREAK_SYSTEM_PACKAGES: 1

jobs:
  build-mac-nodejs:
    name: macos-nodejs-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            cmakeArch: arm64
          # macos-15-intel is GitHub's replacement for the retired macos-13
          # image and is the last x86_64 macOS runner (available until Aug 2027).
          - runner: macos-15-intel
            arch: x64
            cmakeArch: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update nightly version
        if: ${{ inputs.isNightly == true }}
        run: |
          python3 -m pip install packaging
          python3 update-nightly-build-version.py
        working-directory: scripts

      # cmake-js is needed at configure time to locate the Node-API headers.
      - name: Install Node.js build dependencies
        working-directory: tools/nodejs_api
        run: npm install

      - name: Build Node.js native module
        run: make nodejs
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          # Electron requires macOS 11, so the addon must not need anything newer.
          EXTRA_CMAKE_FLAGS: >-
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmakeArch }}
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Report the architecture of the addon
        working-directory: tools/nodejs_api/build
        run: |
          file koredbjs.node
          lipo -archs koredbjs.node

      - name: Move Node.js native module
        working-directory: tools/nodejs_api/build
        run: mv koredbjs.node koredbjs-darwin-${{ matrix.arch }}.node

      - uses: actions/upload-artifact@v4
        with:
          name: mac-nodejs-module-${{ matrix.arch }}
          path: tools/nodejs_api/build/koredbjs-darwin-${{ matrix.arch }}.node
          if-no-files-found: error
