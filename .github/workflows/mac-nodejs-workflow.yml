name: Build macOS Node.js Module

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      isNightly:
        type: boolean
        required: true
        default: false

env:
  PIP_BREAK_SYSTEM_PACKAGES: 1

jobs:
  build-mac-nodejs:
    name: macos-nodejs-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            archflags: "-arch arm64"
          # macos-15-intel is GitHub's replacement for the retired macos-13
          # image and is the last x86_64 macOS runner (available until Aug 2027).
          - runner: macos-15-intel
            arch: x64
            archflags: "-arch x86_64"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update nightly version
        if: ${{ inputs.isNightly == true }}
        run: |
          python3 -m pip install packaging
          python3 update-nightly-build-version.py
        working-directory: scripts

      - name: Create Node.js source distribution
        working-directory: tools/nodejs_api
        run: |
          rm -rf koredb-source.tar.gz package *.node
          node package

      - name: Extract tarball
        working-directory: tools/nodejs_api
        run: tar -xzf koredb-source.tar.gz

      - name: Build Node.js native module
        working-directory: tools/nodejs_api/package
        run: npm i
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          ARCHFLAGS: ${{ matrix.archflags }}

      - name: Move Node.js native module
        working-directory: tools/nodejs_api
        run: mv package/koredbjs.node koredbjs-darwin-${{ matrix.arch }}.node

      - uses: actions/upload-artifact@v4
        with:
          name: mac-nodejs-module-${{ matrix.arch }}
          path: tools/nodejs_api/koredbjs-darwin-${{ matrix.arch }}.node
          if-no-files-found: error

      - name: Clean up
        if: always()
        working-directory: tools/nodejs_api
        run: rm -rf package
