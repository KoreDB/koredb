name: Python source installation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'setup.py'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'tools/python_api/**'
      - 'third_party/pybind11/**'
      - '.github/workflows/python-source-install.yml'

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python: ['3.11', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Install Make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }
      - name: Install from the checkout
        run: python -m pip install .
      - name: Run an in-memory query
        run: python -c "import koredb; db = koredb.Database(); conn = koredb.Connection(db); assert conn.execute('RETURN 1').get_next() == [1]"
