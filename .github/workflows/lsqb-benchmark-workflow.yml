name: LSQB Benchmark
on:
  # Manual only. This job is expensive and is not part of the day-to-day
  # loop, so it carries no automatic trigger. Start it from the Actions tab
  # when you actually want the numbers.
  workflow_dispatch:
    inputs:
      scale_factor:
        description: 'Scale factor'
        required: true
        default: "30"
        type: choice
        options:
          - "0.1"
          - "0.3"
          - "1"
          - "3"
          - "10"
          - "30"
          - "100"
      timeout:
        description: 'Timeout in milliseconds'
        required: true
        default: 60000
        type: number

jobs:
  benchmark:
    name: benchmark
    env:
      NUM_THREADS: 4
      GEN: Ninja
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Set env for scheduled run
        if: ${{ github.event_name == 'schedule' }}
        run: |
            echo "TIMEOUT=600000" >> $GITHUB_ENV
            echo "SCALE_FACTOR=100" >> $GITHUB_ENV

      - name: Set env for workflow dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
            echo "TIMEOUT=${{ github.event.inputs.timeout }}" >> $GITHUB_ENV
            echo "SCALE_FACTOR=${{ github.event.inputs.scale_factor }}" >> $GITHUB_ENV

      - uses: actions/checkout@v4

      - name: Build
        run: |
          pip install -r tools/python_api/requirements_dev.txt 
          make python

      - name: Benchmark
        run: python3 benchmark/lsqb/benchmark_runner.py

      - name: Upload result csv
        uses: actions/upload-artifact@v4
        with:
          name: lsqb-benchmark-result
          path: /tmp/benchmark_result/results.csv
          retention-days: 1
      
      - name: Upload log
        uses: actions/upload-artifact@v4
        with:
          name: lsqb-benchmark-log
          path: lsqb.log
          retention-days: 1

      - name: Archive the benchmark output
        id: bench-archive
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          SLUG: lsqb
        run: |
          set -euo pipefail
          ARCHIVE="${SLUG}-$(echo "$GITHUB_SHA" | cut -c1-7).tar.gz"
          rm -rf bench-release && mkdir bench-release
          for src in /tmp/benchmark_result/results.csv lsqb.log; do
            if [ -e "$src" ]; then
              cp -r "$src" bench-release/
            else
              echo "missing, skipped: $src"
            fi
          done
          if [ -z "$(ls -A bench-release)" ]; then
            echo "nothing to publish"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tar -czf "$ARCHIVE" -C bench-release .
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Publish the benchmark output to a GitHub Release
        if: ${{ github.event_name != 'pull_request' && steps.bench-archive.outputs.published == 'true' }}
        uses: ./.github/actions/upload-release-asset
        with:
          tag: benchmarks
          title: Benchmark output
          files: ${{ steps.bench-archive.outputs.archive }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report result to server
        run:  python3 benchmark/lsqb/results_reporter.py
