name: Build Linux Node.js Module

on:
  workflow_dispatch:
    inputs:
      uploadToRelease:
        description: "Also upload the built addons to a GitHub Release"
        type: boolean
        required: false
        default: false
      releaseTag:
        description: "Release tag to upload to. Empty derives v<project version> from CMakeLists.txt."
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      uploadToRelease:
        type: boolean
        required: false
        default: false
      releaseTag:
        type: string
        required: false
        default: ""
jobs:
  build-linux-nodejs:
    name: linux-nodejs-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    # Build inside manylinux so the resulting addon keeps a low glibc floor
    # (manylinux_2_28 => glibc 2.28, i.e. RHEL 8 / Ubuntu 20.04 and newer).
    container:
      image: quay.io/pypa/manylinux_2_28_${{ matrix.manylinuxArch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            manylinuxArch: x86_64
            nodeDist: linux-x64
          - runner: ubuntu-24.04-arm
            arch: arm64
            manylinuxArch: aarch64
            nodeDist: linux-arm64
    env:
      NODE_VERSION: v20.19.2
      PYBIN: /opt/python/cp311-cp311/bin
    steps:
      - name: Install build toolchain
        run: |
          dnf install -y make tar xz gzip which
          "$PYBIN/python" -m pip install --upgrade pip cmake ninja packaging
          echo "$PYBIN" >> "$GITHUB_PATH"

      - name: Install Node.js
        run: |
          curl -fsSL "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-${{ matrix.nodeDist }}.tar.xz" -o /tmp/node.tar.xz
          mkdir -p /opt/node
          tar -xJf /tmp/node.tar.xz -C /opt/node --strip-components=1
          echo "/opt/node/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Report toolchain versions
        run: |
          node --version
          npm --version
          cmake --version
          python --version

      # cmake-js is needed at configure time to locate the Node-API headers.
      - name: Install Node.js build dependencies
        working-directory: tools/nodejs_api
        run: npm install

      # These are what CMakeLists.txt consumes to locate the Node-API headers.
      # print-cmakejs-include returns more than one directory, so the raw output
      # is worth having in the log when a header ever goes missing again.
      - name: Report cmake-js paths
        working-directory: tools/nodejs_api
        run: |
          echo "--- print-cmakejs-include ---"
          npx cmake-js print-cmakejs-include || true
          echo "--- print-cmakejs-lib ---"
          npx cmake-js print-cmakejs-lib || true
          echo "--- print-cmakejs-src ---"
          npx cmake-js print-cmakejs-src || true

      - name: Build Node.js native module
        run: make nodejs

      # Electron loadability and the glibc/libstdc++ floor are properties of
      # the produced binary that no passing Node.js test suite can detect -
      # every way of losing them still works under plain `node`. They are
      # asserted here, on the artifact that ships.
      - name: Verify the addon
        working-directory: tools/nodejs_api
        run: npm run verify:addon -- build/koredbjs.node

      - name: Move Node.js native module
        working-directory: tools/nodejs_api/build
        run: mv koredbjs.node koredbjs-linux-${{ matrix.arch }}.node

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: linux-nodejs-module-${{ matrix.arch }}
          path: tools/nodejs_api/build/koredbjs-linux-${{ matrix.arch }}.node
          if-no-files-found: error
          retention-days: 1

  # Publishing runs on its own hosted runner rather than inside the build
  # job: the composite action drives `gh`, which the build environment does
  # not necessarily have (the Linux addon is built inside a manylinux
  # container). Downloading the artifact back is cheap by comparison.
  publish-release:
    name: publish the Linux addons to a GitHub Release
    needs: [build-linux-nodejs]
    if: ${{ inputs.uploadToRelease }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: linux-nodejs-module-*
          path: prebuilt
          merge-multiple: true

      - name: List the addons to publish
        run: ls -l prebuilt

      - name: Publish the addons to a GitHub Release
        uses: ./.github/actions/upload-release-asset
        with:
          files: prebuilt/*.node
          tag: ${{ inputs.releaseTag }}
          token: ${{ secrets.GITHUB_TOKEN }}
