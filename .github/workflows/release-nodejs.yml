name: Release Node.js Packages

# Builds the six prebuilt addons, assembles the npm artifacts (@koredb/koredb
# plus one @koredb/koredb-<platform>-<arch> package per addon), verifies them
# inside a real Electron main process on every supported platform, and only
# then publishes to npm.
#
# This exists separately from build-and-deploy.yml so that shipping the npm
# packages does not depend on the Python, WebAssembly or extension pipelines:
# a failure anywhere in those must not be able to block or break a Node.js
# release, and vice versa.
#
# Publishing is gated: `publish` needs `test-electron`, so nothing reaches the
# registry unless the addon actually loaded and answered a query on all six
# platform/architecture combinations.
#
# Build output is attached to a GitHub Release as well: the six addons as raw
# .node files (for apps that vendor a binary directly) and the npm tarballs.
# That step is independent of the npm publish - either can run without the
# other.
#
# The whole workflow is manual by design - npm releases are never triggered by a
# push. Dispatching it with "Publish to npm?" unchecked builds everything, runs
# the six-platform Electron matrix and stops at a `--dry-run` publish, which is
# also how to get full-matrix Electron coverage on demand. The per-commit
# Electron guard is nodejs-electron-ci.yml.

on:
  workflow_dispatch:
    inputs:
      isDeploy:
        description: "Publish to npm? Leave unchecked to build, test and dry-run only."
        type: boolean
        required: true
        default: false
      githubRelease:
        description: "Attach the six addons and the npm tarballs to a GitHub Release."
        type: boolean
        required: true
        default: true
      releaseTag:
        description: "Release tag to upload to. Empty derives v<project version> from CMakeLists.txt."
        type: string
        required: false
        default: ""

jobs:
  build-mac:
    uses: ./.github/workflows/mac-nodejs-workflow.yml
    secrets: inherit

  build-linux:
    uses: ./.github/workflows/linux-nodejs-workflow.yml
    secrets: inherit

  build-windows:
    uses: ./.github/workflows/windows-nodejs-workflow.yml
    secrets: inherit

  package:
    needs: [build-mac, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Collect prebuilt addons
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: "*-nodejs-module-*"
          path: tools/nodejs_api/prebuilt
          merge-multiple: true

      - name: List prebuilt addons
        run: ls -l tools/nodejs_api/prebuilt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"

      - name: Build the main package and the per-platform addon packages
        run: node package
        working-directory: tools/nodejs_api

      - name: Show packaged tarballs
        working-directory: tools/nodejs_api
        run: |
          ls -l dist
          cat dist/packages.json

      - name: Fail if the addon matrix is incomplete
        working-directory: tools/nodejs_api
        run: |
          set -eu
          count=$(node -p "require('./dist/packages.json').platforms.length")
          echo "platform packages built: $count"
          if [ "$count" -ne 6 ]; then
            echo "Expected 6 platform packages, refusing to publish a partial matrix." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: koredb-deploy-nodejs
          path: tools/nodejs_api/dist
          if-no-files-found: error
          retention-days: 1

  test-electron:
    needs: [package]
    uses: ./.github/workflows/nodejs-electron-test.yml
    with:
      artifactName: koredb-deploy-nodejs
    secrets: inherit

  github-release:
    name: attach the build output to a GitHub Release
    needs: [package, test-electron]
    if: ${{ inputs.githubRelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # The raw addons, exactly as the three build workflows produced them, so
      # that an Electron app can vendor one binary without going through npm.
      - name: Collect the prebuilt addons
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: "*-nodejs-module-*"
          path: prebuilt
          merge-multiple: true

      # ... plus the packaged tarballs, which are what `npm install <url>` and
      # air-gapped installs consume.
      - name: Collect the npm tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: koredb-deploy-nodejs
          path: dist

      - name: List the release assets
        run: ls -l prebuilt dist

      - name: Publish to a GitHub Release
        uses: ./.github/actions/upload-release-asset
        with:
          files: prebuilt/*.node dist/*.tgz
          tag: ${{ inputs.releaseTag }}
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [package, test-electron]
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_JS_TOKEN }}
    steps:
      # publish.js lives in the repository, not in the built artifact.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: koredb-deploy-nodejs
          path: tools/nodejs_api/dist

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # publish.js pushes the six addon packages first and the main package
      # last, so @koredb/koredb is never resolvable before the binary it pins
      # as an optional dependency is.
      - name: Publish dry run
        if: ${{ !inputs.isDeploy }}
        run: node publish.js --tag latest --dry-run
        working-directory: tools/nodejs_api

      - name: Publish to npm
        if: ${{ inputs.isDeploy }}
        run: node publish.js --tag latest
        working-directory: tools/nodejs_api
