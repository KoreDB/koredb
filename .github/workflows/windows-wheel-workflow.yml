# Reusable workflow. Called by publish-python.yml to build the Windows Python wheels.
name: Build Windows Wheels

on:
  workflow_dispatch:
  workflow_call:
jobs:
  build-windows-wheels-amd64:
    name: windows-wheel-AMD64-${{ matrix.python }}
    runs-on: windows-2025
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        python: ["cp39", "cp310", "cp311", "cp312", "cp313", "cp314", "cp315"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install packaging dependencies
        run: python -m pip install setuptools wheel

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: amd64

      - name: Ensure GNU Make is available
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }
          make --version

      - name: Determine NUM_THREADS
        shell: pwsh
        run: |
          "NUM_THREADS=$env:NUMBER_OF_PROCESSORS" >> $env:GITHUB_ENV

      - name: Create source distribution
        working-directory: ./scripts/pip-package/
        shell: pwsh
        run: |
          if (Test-Path wheelhouse) { Remove-Item -Recurse -Force wheelhouse }
          New-Item -ItemType Directory wheelhouse | Out-Null
          python package_tar.py koredb.tar.gz

      - name: Build wheels
        working-directory: ./scripts/pip-package/
        env:
          CIBW_BUILD: ${{ matrix.python }}-*
          CIBW_ARCHS_WINDOWS: AMD64
          CIBW_BUILD_VERBOSITY: 3
          CIBW_TEST_COMMAND: 'python -c "import koredb; db = koredb.Database(); conn = koredb.Connection(db); assert conn.execute(''RETURN 1'').get_next() == [1]"'
        run: pipx run --spec "cibuildwheel==4.3.5" cibuildwheel --output-dir wheelhouse koredb.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-wheels-AMD64-${{ matrix.python }}
          path: ./scripts/pip-package/wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 1

  build-windows-wheels-arm64:
    name: windows-wheel-ARM64-${{ matrix.python }}
    runs-on: windows-11-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # CPython only ships official win_arm64 builds from 3.11 onwards.
      matrix:
        python: ["cp311", "cp312", "cp313", "cp314", "cp315"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install packaging dependencies
        run: python -m pip install setuptools wheel

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: arm64

      - name: Ensure GNU Make is available
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }
          make --version

      - name: Determine NUM_THREADS
        shell: pwsh
        run: |
          "NUM_THREADS=$env:NUMBER_OF_PROCESSORS" >> $env:GITHUB_ENV

      - name: Create source distribution
        working-directory: ./scripts/pip-package/
        shell: pwsh
        run: |
          if (Test-Path wheelhouse) { Remove-Item -Recurse -Force wheelhouse }
          New-Item -ItemType Directory wheelhouse | Out-Null
          python package_tar.py koredb.tar.gz

      - name: Build wheels
        working-directory: ./scripts/pip-package/
        env:
          CIBW_BUILD: ${{ matrix.python }}-*
          CIBW_ARCHS_WINDOWS: ARM64
          CIBW_BUILD_VERBOSITY: 3
          CIBW_TEST_COMMAND: 'python -c "import koredb; db = koredb.Database(); conn = koredb.Connection(db); assert conn.execute(''RETURN 1'').get_next() == [1]"'
        run: pipx run --spec "cibuildwheel==4.3.5" cibuildwheel --output-dir wheelhouse koredb.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-wheels-ARM64-${{ matrix.python }}
          path: ./scripts/pip-package/wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 1
