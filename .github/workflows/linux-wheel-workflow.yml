# Reusable workflow. Called by publish-python.yml to build the Linux Python wheels.
name: Build Linux Wheels

on:
  workflow_dispatch:
  workflow_call:
env:
  PIP_BREAK_SYSTEM_PACKAGES: 1

jobs:
  build-linux-wheels:
    name: linux-wheel-${{ matrix.target.arch }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install packaging dependencies
        run: python -m pip install setuptools wheel

      - name: Create source distribution
        working-directory: ./scripts/pip-package/
        run: |
          rm -rf wheelhouse koredb.tar.gz
          mkdir wheelhouse
          python package_tar.py koredb.tar.gz

      - name: Build wheels
        working-directory: ./scripts/pip-package/
        env:
          CIBW_BUILD: cp312-*
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS_LINUX: ${{ matrix.target.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_BUILD_VERBOSITY: 3
          CIBW_TEST_COMMAND: 'python -c "import koredb; db = koredb.Database(); conn = koredb.Connection(db); assert conn.execute(''RETURN 1'').get_next() == [1]"'
        run: pipx run --spec 'cibuildwheel==4.3.5' cibuildwheel --output-dir wheelhouse koredb.tar.gz

      - uses: ./.github/actions/test-python-wheel
        with:
          wheel-directory: scripts/pip-package/wheelhouse

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-wheels-${{ matrix.target.arch }}
          path: ./scripts/pip-package/wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 1
