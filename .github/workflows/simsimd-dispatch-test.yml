name: SimSIMD Dispatch Test
on:
  # Manual only. This job is expensive and is not part of the day-to-day
  # loop; the nightly schedule was removed deliberately. Start it from the
  # Actions tab when you actually want the numbers.
  workflow_dispatch:

jobs:
  build-precompiled-bin-linux:
    uses: ./.github/workflows/linux-precompiled-bin-workflow.yml
    with:
      isNightly: true
      x86_64Only: true
    secrets: inherit

  build-extensions-linux:
    uses: ./.github/workflows/build-extensions.yml
    with:
      x86_64LinuxOnly: true
    secrets: inherit

  simsimd-dispatch-test:
    name: simsimd-dispatch-test
    needs: [build-precompiled-bin-linux, build-extensions-linux]
    runs-on: koredb-self-hosted-testing
    env:
      NUM_THREADS: 32
      GEN: Ninja
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4

      - name: Download nightly build
        uses: actions/download-artifact@v4
        with:
          name: koredb_cli-linux-x86_64

      - name: Download extensions
        uses: actions/download-artifact@v4
        with:
          name: koredb-extensions_linux-x86_64

      - name: Extract artifacts
        run: |
          tar xf koredb_cli-linux-x86_64.tar.gz

      - name: Test
        run: gdb --batch -x scripts/test-simsimd-dispatch.py --args ./koredb
