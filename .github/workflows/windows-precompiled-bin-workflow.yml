name: Build Windows Precompiled Binaries

on:
  workflow_dispatch:
    inputs:
      isNightly:
        description: "Publish to the rolling `nightly` release instead of the version tag"
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      isNightly:
        type: boolean
        required: true
        default: false

jobs:
  build-precompiled-bin:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update nightly version
        if: ${{ inputs.isNightly == true }}
        run: |
          pip3 install packaging
          python3 update-nightly-build-version.py
        working-directory: ./scripts

      - name: Build precompiled binaries
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat"
          make NUM_THREADS=%NUMBER_OF_PROCESSORS%
          make install

      - name: Collect artifacts
        shell: cmd
        run: |
          move install\include\koredb.h
          move install\include\koredb.hpp
          move install\bin\koredb_shared.dll
          move install\lib\koredb_shared.lib
          move install\bin\koredb_shell.exe koredb.exe

      - uses: actions/upload-artifact@v4
        with:
          name: libkoredb-windows-x86_64
          path: |
            koredb.h
            koredb.hpp
            koredb_shared.dll
            koredb_shared.lib
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: koredb_cli-windows-x86_64
          path: koredb.exe
          retention-days: 1

      - name: Create archives for the release
        shell: pwsh
        run: |
          Compress-Archive -Force -DestinationPath libkoredb-windows-x86_64.zip `
            -Path koredb.h, koredb.hpp, koredb_shared.dll, koredb_shared.lib
          Compress-Archive -Force -DestinationPath koredb_cli-windows-x86_64.zip `
            -Path koredb.exe

      - name: Publish the binaries to a GitHub Release
        uses: ./.github/actions/upload-release-asset
        with:
          nightly: ${{ inputs.isNightly }}
          files: libkoredb-windows-x86_64.zip koredb_cli-windows-x86_64.zip
          token: ${{ secrets.GITHUB_TOKEN }}
