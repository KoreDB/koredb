name: LDBC SNB Business Intelligence Benchmark

on:
  # Manual only. This job is expensive and is not part of the day-to-day
  # loop, so it carries no automatic trigger. Start it from the Actions tab
  # when you actually want the numbers.
  workflow_dispatch:
    inputs:
      scale_factor:
        description: 'Scale factor'
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "10"
          - "30"
          - "100"

jobs:
  benchmark:
    name: business-intelligence-benchmark
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      NUM_THREADS: 4
      GEN: Ninja
    steps:
      - name: Set env for scheduled run
        if: ${{ github.event_name == 'schedule' }}
        run: |
          echo "SCALE_FACTOR=1" >> $GITHUB_ENV

      - name: Set env for workflow dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "SCALE_FACTOR=${{ github.event.inputs.scale_factor }}" >> $GITHUB_ENV
    
      - name: Set environment variables
        run: |
          echo "KOREDB_CSV_DIR=$CSV_DIR/bi-dataset/bi-sf${SCALE_FACTOR}-composite-projected-fk/graphs/csv/bi/composite-projected-fk/" >> $GITHUB_ENV
          echo "KOREDB_DIR=$(pwd)" >> $GITHUB_ENV
          echo "KOREDB_BUILD_PATH=$(pwd)/tools/python_api/build" >> $GITHUB_ENV

      - uses: actions/checkout@v4

      - name: Build koredb
        run: |
          pip3 install -r tools/python_api/requirements_dev.txt
          make python
    
      - name: Clone implementation
        uses: actions/checkout@v4
        with:
          repository: koredb/ldbc_snb_bi
          path: ldbc_snb_bi
          token: ${{ secrets.DOC_PUSH_TOKEN }}
    
      - name: Link substitution parameters
        working-directory: ldbc_snb_bi
        run: |
          rm -rf parameters
          ln -s $CSV_DIR/bi-dataset/ldbc-snb-bi-parameters-sf1-to-sf30000 parameters
    
      - name: Load database
        working-directory: ldbc_snb_bi/koredb
        run: |
          workflow-scripts/decompress-gz.sh
          workflow-scripts/load-database.sh
    
      - name: Run benchmark
        working-directory: ldbc_snb_bi/koredb
        run: workflow-scripts/benchmark.sh
    
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: LDBC-SNB-Business-Intelligence-results
          path: ldbc_snb_bi/koredb/output/
          retention-days: 1

      - name: Archive the benchmark output
        id: bench-archive
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          SLUG: ldbc-snb-bi
        run: |
          set -euo pipefail
          ARCHIVE="${SLUG}-$(echo "$GITHUB_SHA" | cut -c1-7).tar.gz"
          rm -rf bench-release && mkdir bench-release
          for src in ldbc_snb_bi/koredb/output; do
            if [ -e "$src" ]; then
              cp -r "$src" bench-release/
            else
              echo "missing, skipped: $src"
            fi
          done
          if [ -z "$(ls -A bench-release)" ]; then
            echo "nothing to publish"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tar -czf "$ARCHIVE" -C bench-release .
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Publish the benchmark output to a GitHub Release
        if: ${{ github.event_name != 'pull_request' && steps.bench-archive.outputs.published == 'true' }}
        uses: ./.github/actions/upload-release-asset
        with:
          tag: benchmarks
          title: Benchmark output
          files: ${{ steps.bench-archive.outputs.archive }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report result to server
        working-directory: ldbc_snb_bi/koredb/
        run: |
          python3 workflow-scripts/report_results.py
