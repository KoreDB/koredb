name: Node.js Electron Test

# Verifies that the *published* Node.js packages load and run inside a real
# Electron main process on every supported platform/architecture. The addon is
# built against Node-API (NAPI_VERSION=6), which is ABI-stable across Node.js
# and Electron, so the prebuilt binaries are reused as-is - this workflow is the
# guard that keeps that assumption honest. It also checks that the split
# main-package / per-platform-addon-package layout resolves the way it must.
#
# This is the release-gating matrix, driven by release-nodejs.yml. The per-commit
# counterpart is nodejs-electron-ci.yml, which builds from source and covers
# Linux x64 only; both share .github/actions/electron-smoke-test.

on:
  workflow_dispatch:
    inputs:
      artifactName:
        description: "Name of the artifact holding the packaged npm tarballs"
        type: string
        required: true
        default: koredb-deploy-nodejs
  workflow_call:
    inputs:
      artifactName:
        type: string
        required: false
        default: koredb-deploy-nodejs

jobs:
  electron-test:
    name: electron-${{ matrix.target.os }}-${{ matrix.target.arch }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - { runner: ubuntu-24.04, os: linux, arch: x64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
          - { runner: macos-14, os: macos, arch: arm64 }
          - { runner: macos-15-intel, os: macos, arch: x64 }
          - { runner: windows-2022, os: windows, arch: x64 }
          - { runner: windows-11-arm, os: windows, arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download packaged npm tarballs
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifactName }}
          path: packaged

      - name: Electron smoke test
        uses: ./.github/actions/electron-smoke-test
        with:
          dist-dir: packaged

      - name: Verify cross-platform selection of the addon package
        # Electron apps are routinely packaged for a target other than the build
        # machine. With the split layout that is an `npm install --os --cpu`,
        # which redirects the main package's optional dependency resolution at
        # the requested target. One runner is enough - the logic is shared.
        if: ${{ matrix.target.runner == 'ubuntu-24.04' }}
        shell: bash
        env:
          PACKAGED: ${{ github.workspace }}/packaged
        run: |
          set -euo pipefail
          # --os/--cpu require npm >= 10.6; the runner ships a newer npm.
          npm --version
          workdir="$(mktemp -d)"
          cd "$workdir"
          # The platform packages are not on the registry yet, so point the main
          # package's optional dependencies at the freshly built tarballs.
          node -e '
            const fs = require("fs");
            const path = require("path");
            const dist = process.env.PACKAGED;
            const manifest = require(path.join(dist, "packages.json"));
            const overrides = {};
            for (const entry of manifest.platforms) {
              overrides[entry.packageName] = "file:" + path.join(dist, entry.tarball);
            }
            fs.writeFileSync("package.json", JSON.stringify({
              name: "koredb-cross-install-test",
              version: "1.0.0",
              private: true,
              // Keyed by the real package name. Under any other key npm
              // installs the tarball into an alias directory, and
              // require("@koredb/koredb") stops resolving - which is not
              // the layout a user ever gets.
              dependencies: {
                [manifest.main.packageName]:
                  "file:" + path.join(dist, manifest.main.tarball),
              },
              overrides,
            }, null, 2));
          '
          npm install --os=darwin --cpu=arm64
          # The main package has to land under its real name, ...
          test -f node_modules/@koredb/koredb/package.json
          # ... and drag in only the addon for the requested target.
          test -f node_modules/@koredb/koredb-darwin-arm64/koredbjs.node
          # The host addon must NOT have been installed for a darwin target.
          test ! -d node_modules/@koredb/koredb-linux-x64
          echo "npm --os=darwin --cpu=arm64 selected the darwin-arm64 addon package."
