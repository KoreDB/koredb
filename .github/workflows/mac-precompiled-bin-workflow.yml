name: Build Mac Precompiled Binaries

on:
  workflow_dispatch:
    inputs:
      isNightly:
        description: "Publish to the rolling `nightly` release instead of the version tag"
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      isNightly:
        type: boolean
        required: true
        default: false
env:
  PIP_BREAK_SYSTEM_PACKAGES: 1

jobs:
  build-precompiled-bin-universal:
    runs-on: macos-15-intel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Update nightly version
        if: ${{ inputs.isNightly == true }}
        run: |
          pip3 install packaging
          python3 update-nightly-build-version.py
        working-directory: scripts

      - name: Build universal precompiled binaries
        run: |
          make NUM_THREADS=$(sysctl -n hw.ncpu)
          make install
        env:
          MACOSX_DEPLOYMENT_TARGET: 11.0
          CMAKE_OSX_ARCHITECTURES: "x86_64;arm64"

      - name: Collect artifacts
        run: |
          mv install/include/koredb.h .
          mv install/include/koredb.hpp .
          mv install/lib/libkoredb.dylib .
          mv install/bin/koredb .

      - name: Verify binary information
        run: |
          file -b koredb
          otool -l koredb | grep minos
          file -b libkoredb.dylib
          otool -l libkoredb.dylib | grep minos

      - name: Create tarball
        run: |
          tar -czvf libkoredb-osx-universal.tar.gz koredb.h koredb.hpp libkoredb.dylib
          tar -czvf koredb_cli-osx-universal.tar.gz koredb

      - uses: actions/upload-artifact@v4
        with:
          name: libkoredb-osx-universal
          path: libkoredb-osx-universal.tar.gz
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: koredb_cli-osx-universal
          path: koredb_cli-osx-universal.tar.gz
          retention-days: 1

      - name: Publish the binaries to a GitHub Release
        uses: ./.github/actions/upload-release-asset
        with:
          nightly: ${{ inputs.isNightly }}
          files: libkoredb-osx-universal.tar.gz koredb_cli-osx-universal.tar.gz
          token: ${{ secrets.GITHUB_TOKEN }}
