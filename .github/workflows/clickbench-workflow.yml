name: ClickBench
on:
  # Manual only. This job is expensive and is not part of the day-to-day
  # loop; the nightly schedule was removed deliberately. Start it from the
  # Actions tab when you actually want the numbers.
  workflow_dispatch:
  workflow_call:

jobs:
  click_benchmark:
    name: click benchmark
    env:
      NUM_THREADS: 4
      GEN: Ninja
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make benchmark

      - name: Benchmark
        continue-on-error: true
        run: |
          set +e
          python3 benchmark/benchmark_runner.py --dataset click --thread 100
          echo $? > benchmark/exit_code
      
      - name: Upload benchmark logs
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-logs
          path: /tmp/benchmark_logs
          retention-days: 1

      - name: Upload comparison results
        uses: actions/upload-artifact@v4
        with:
          name: comparison-results
          path: benchmark/compare_result.md
          retention-days: 1

      - name: Archive the benchmark output
        id: bench-archive
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          ARCHIVE: clickbench-${{ github.run_id }}.tar.gz
        run: |
          set -euo pipefail
          rm -rf bench-release && mkdir bench-release
          for src in /tmp/benchmark_logs benchmark/compare_result.md; do
            if [ -e "$src" ]; then
              cp -r "$src" bench-release/
            else
              echo "missing, skipped: $src"
            fi
          done
          if [ -z "$(ls -A bench-release)" ]; then
            echo "nothing to publish"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tar -czf "$ARCHIVE" -C bench-release .
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Publish the benchmark output to a GitHub Release
        if: ${{ github.event_name != 'pull_request' && steps.bench-archive.outputs.published == 'true' }}
        uses: ./.github/actions/upload-release-asset
        with:
          tag: benchmarks
          title: Benchmark output
          files: ${{ steps.bench-archive.outputs.archive }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if benchmark failed
        run: |
          if [ $(cat benchmark/exit_code) -ne 0 ]; then
            echo "Benchmark failed"
            exit 1
          fi
