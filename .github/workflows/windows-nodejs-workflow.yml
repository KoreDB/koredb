# Reusable workflow. Called by build-and-deploy.yml to build the Windows Node.js addon.
name: Build Windows Node.js Module

on:
  workflow_dispatch:
    inputs:
      uploadToRelease:
        description: "Also upload the built addons to a GitHub Release"
        type: boolean
        required: false
        default: false
      releaseTag:
        description: "Release tag to upload to. Empty derives v<project version> from CMakeLists.txt."
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      uploadToRelease:
        type: boolean
        required: false
        default: false
      releaseTag:
        type: string
        required: false
        default: ""
jobs:
  build-windows-nodejs:
    name: windows-nodejs-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
            msvcArch: amd64
          - runner: windows-11-arm
            arch: arm64
            msvcArch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        with:
          arch: ${{ matrix.msvcArch }}

      - name: Ensure GNU Make is available
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }
          make --version

      - name: Determine NUM_THREADS
        shell: pwsh
        run: |
          "NUM_THREADS=$env:NUMBER_OF_PROCESSORS" >> $env:GITHUB_ENV

      - name: Install Node.js dependencies
        working-directory: tools/nodejs_api
        shell: cmd
        run: npm i

      - name: Build Node.js native module
        shell: cmd
        run: make nodejs NUM_THREADS=%NUM_THREADS%

      # Electron loadability and the glibc/libstdc++ floor are properties of
      # the produced binary that no passing Node.js test suite can detect -
      # every way of losing them still works under plain `node`. They are
      # asserted here, on the artifact that ships.
      - name: Verify the addon
        working-directory: tools/nodejs_api
        shell: cmd
        run: npm run verify:addon -- build/koredbjs.node

      - name: Move Node.js native module
        working-directory: tools/nodejs_api/build
        shell: cmd
        run: ren koredbjs.node koredbjs-win32-${{ matrix.arch }}.node

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: windows-nodejs-module-${{ matrix.arch }}
          path: tools/nodejs_api/build/koredbjs-win32-${{ matrix.arch }}.node
          if-no-files-found: error
          retention-days: 1

  # Publishing runs on its own hosted runner rather than inside the build
  # job: the composite action drives `gh`, which the build environment does
  # not necessarily have (the Linux addon is built inside a manylinux
  # container). Downloading the artifact back is cheap by comparison.
  publish-release:
    name: publish the Windows addons to a GitHub Release
    needs: [build-windows-nodejs]
    if: ${{ inputs.uploadToRelease }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: windows-nodejs-module-*
          path: prebuilt
          merge-multiple: true

      - name: List the addons to publish
        run: ls -l prebuilt

      - name: Publish the addons to a GitHub Release
        uses: ./.github/actions/upload-release-asset
        with:
          files: prebuilt/*.node
          tag: ${{ inputs.releaseTag }}
          token: ${{ secrets.GITHUB_TOKEN }}
