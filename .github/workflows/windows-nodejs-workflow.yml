# Reusable workflow. Called by build-and-deploy.yml to build the Windows Node.js addon.
name: Build Windows Node.js Module

on:
  workflow_dispatch:
  workflow_call:
jobs:
  build-windows-nodejs:
    name: windows-nodejs-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
            msvcArch: amd64
          - runner: windows-11-arm
            arch: arm64
            msvcArch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0
        with:
          arch: ${{ matrix.msvcArch }}

      - name: Ensure GNU Make is available
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }
          make --version

      - name: Determine NUM_THREADS
        shell: pwsh
        run: |
          "NUM_THREADS=$env:NUMBER_OF_PROCESSORS" >> $env:GITHUB_ENV

      - name: Install Node.js dependencies
        working-directory: tools/nodejs_api
        shell: cmd
        run: npm i

      - name: Build Node.js native module
        shell: cmd
        run: make nodejs NUM_THREADS=%NUM_THREADS%

      - name: Move Node.js native module
        working-directory: tools/nodejs_api/build
        shell: cmd
        run: ren koredbjs.node koredbjs-win32-${{ matrix.arch }}.node

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: windows-nodejs-module-${{ matrix.arch }}
          path: tools/nodejs_api/build/koredbjs-win32-${{ matrix.arch }}.node
          if-no-files-found: error
          retention-days: 1
